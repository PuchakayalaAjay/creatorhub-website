{% extends 'base.html' %}{% block content %}<h1>Products</h1><div class="grid">{% for p in products %}<div class="card">{% if p.image_url %}<img class="product-img" src="{{ p.image_url }}" alt="{{ p.name }}">{% endif %}<h3>{{ p.name }}</h3><p class="muted">{{ p.description }}</p><a class="btn" href="{{ p.link }}" target="_blank">View Product</a></div>{% else %}<div class="card"><p>No products available yet.</p></div>{% endfor %}</div>{% endblock %}
