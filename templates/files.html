{% extends 'base.html' %}{% block content %}<h1>Files</h1><p class="muted">Shared documents and resources.</p><div class="grid">{% for f in files %}<div class="card"><h3>{{ f.title }}</h3><p class="muted">{{ f.description }}</p><p>{{ f.original_name }}</p><a class="btn" href="{{ f.url }}" target="_blank">Open / Download</a></div>{% else %}<div class="card"><p>No files available yet.</p></div>{% endfor %}</div>{% endblock %}
